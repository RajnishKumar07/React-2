<!doctype html>
<html>
  <head>
    <title>Chat Bot</title>
    <style>
      body {
        font-family: Arial;
        margin: 0;
      }
      .app-container {
        max-width: 700px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin: 0 auto;
      }
      .chat-input {
        padding: 10px;
        font-size: 18px;
        border-radius: 9px;
        border: 1px solid;
        flex-grow: 1;
      }
      .input-container {
        display: flex;
        gap: 10px;
        margin: 16px;
      }
      .send-btn {
        border: none;
        border-radius: 10px;
        padding: 14px 20px;
        font-size: 16px;
        background: #198754;
        color: white;
        cursor: pointer;
      }

      .chat-container {
        flex-grow: 1;
        overflow: scroll;
        scrollbar-width: none;
        padding: 16px;
      }

      .message-container {
        display: flex;
        gap: 4px;
        align-items: start;
        margin-top: 4px;
      }
      .user-message {
        justify-content: right;
      }
      .robot-message {
        justify-content: left;
      }
      .message {
        background: #eeeeee;
        padding: 16px;
        border-radius: 8px;
        max-width: 50%;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages, setLoading }) {
        const [inputText, setInputText] = React.useState("");
        function saveInputText(event) {
          const value = event.target.value;
          setInputText(value);
        }

        function sendMessage() {
          if (!inputText.trim()) return;

          const text = inputText;

          setInputText("");
          setLoading(true);

          setChatMessages((prev) => [
            ...prev,
            {
              message: text,
              sender: "user",
              id: crypto.randomUUID(),
            },
          ]);

          setTimeout(() => {
            const botResponse = Chatbot.getResponse(text);

            setChatMessages((prev) => [
              ...prev,
              {
                message: botResponse,
                sender: "robot",
                id: crypto.randomUUID(),
              },
            ]);

            setLoading(false);
          }, 2000);
        }
        return (
          <div className="input-container">
            <input
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
              className="chat-input"
            />
            <button onClick={sendMessage} className="send-btn">
              Send
            </button>
          </div>
        );
      }

      function ChatMessage(props) {
        const { message, sender, isMessageLoading } = props;
        return (
          <div
            className={
              sender === "robot"
                ? "message-container robot-message"
                : "message-container user-message"
            }
          >
            {sender === "robot" && (
              <img src="robot.png" alt="robot" width="50" />
            )}

            {isMessageLoading ? (
              <img src="loading-spinner.gif" alt="spinner" width="50" />
            ) : (
              <div className="message">{message}</div>
            )}
            {sender === "user" && <img src="user.png" alt="user" width="50" />}
          </div>
        );
      }

      function ChatMessages({ chatMessages, isMessageLoading }) {
        const chatMessageRef = React.useRef(null);
        React.useEffect(() => {
          const containerElem = chatMessageRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]);
        return (
          <div className="chat-container" ref={chatMessageRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
            {isMessageLoading && (
              <ChatMessage isMessageLoading={isMessageLoading} sender="robot" />
            )}
          </div>
        );
      }

      function App() {
        const [isMessageLoading, setLoading] = React.useState(false);
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: "Hello Chatbot",
            sender: "user",
            id: crypto.randomUUID(),
          },
          {
            message: "Hello! How can I help you?",
            sender: "robot",
            id: crypto.randomUUID(),
          },
          {
            message: `can you get me today's date`,
            sender: "user",
            id: crypto.randomUUID(),
          },
          {
            message: "Today is June 22",
            sender: "robot",
            id: crypto.randomUUID(),
          },
        ]);
        return (
          <div className="app-container">
            <ChatMessages
              chatMessages={chatMessages}
              isMessageLoading={isMessageLoading}
            />
            <ChatInput
              setLoading={setLoading}
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
